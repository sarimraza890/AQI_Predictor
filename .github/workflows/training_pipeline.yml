name: Training Pipeline (Daily)

on:
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  train:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Train, evaluate, and promote best models
        run: python -m training_pipeline.train --all-cities

      - name: Quality gate validation
        run: |
          python - <<'PY'
          import json, glob
          for path in glob.glob("reports/training_summary_*.json"):
              with open(path) as f:
                  summary = json.load(f)
              city = path.split("_")[-1].replace(".json", "")
              for horizon, data in summary.items():
                  best_model = data["best_model"]
                  rmse = data["results"][best_model]["rmse"]
                  if rmse > 55.0:
                      print(f"::warning::{city.capitalize()} {horizon} RMSE={rmse:.2f} exceeds threshold")
          PY

      - name: Commit and push updated model registry & reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add model_registry reports
          if ! git diff --cached --quiet; then
            git commit -m "chore: daily model retraining [skip ci]"
            git pull --rebase origin main
            git push origin main
          else
            echo "No changes to commit."
          fi
