name: Feature Pipeline (Hourly)

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  run-feature-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run feature pipeline for all cities
        run: python -m feature_pipeline.run --all-cities

      - name: Commit and push updated feature store
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feature_store/data/*.parquet
          if ! git diff --cached --quiet; then
            git commit -m "chore: hourly feature update [skip ci]"
            git pull --rebase origin main
            git push origin main
          else
            echo "No new features to commit."
          fi
