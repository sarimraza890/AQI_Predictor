name: Feature Pipeline (Hourly)

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch: {}

jobs:
  run-feature-pipeline:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        city: [Karachi, Lahore, Islamabad]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run feature pipeline for ${{ matrix.city }}
        run: python -m feature_pipeline.run --city "${{ matrix.city }}"

      - name: Commit updated feature store
        run: |
          git config user.name "aqi-bot"
          git config user.email "aqi-bot@users.noreply.github.com"
          git add feature_store/data/*.parquet
          git diff --cached --quiet || git commit -m "chore: hourly feature update [skip ci]"
          git push
